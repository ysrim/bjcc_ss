<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {overflow: hidden; width: 1280px; min-height: 720px; font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            
            background-color: #f8fafc;}

        .slide-container {
            width: 1280px;
            min-height: 720px;
            padding: 30px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
            border: 10px solid #f1f5f9;
            display: flex;
            flex-direction: column;
            color: #1e293b;
        }

        .header-section {
            border-bottom: 2px solid #0284c7;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            flex-grow: 1;
        }

        .feature-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.2);
        }

        .highlight-text {
            color: #0284c7;
            font-weight: 700;
        }

        .step-item {
            background: #f8fafc;
            padding: 12px 20px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-left: 4px solid #0284c7;
        }
    
}</style>
</head>
<body>
<div class="slide-container">
<!-- Header -->
<div class="header-section">
<h1 class="text-5xl font-black mb-4 text-slate-900">온·오프라인 연동 - QR 코드 시스템</h1>
<div class="flex items-center gap-4">
<span class="bg-sky-600 text-white px-4 py-1 rounded font-bold text-xl italic">Bridge</span>
<p class="text-2xl text-sky-700 font-bold">&#34;달란트 시장에서도 스마트하게!&#34;</p>
</div>
</div>
<!-- Main Content -->
<div class="content-grid">
<!-- Left: QR Check-in -->
<div class="feature-card">
<div class="icon-box">
<i class="fa-solid fa-qrcode text-5xl text-white"></i>
</div>
<h2 class="text-3xl font-bold mb-3 text-sky-600">QR 체크인 &amp; 본인 인증</h2>
<div class="space-y-2 w-full">
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">01</span>
<p class="text-lg">오프라인 행사 참여</p>
</div>
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">02</span>
<p class="text-lg">마이페이지 내 <span class="highlight-text">QR 코드</span> 생성</p>
</div>
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">03</span>
<p class="text-lg">관리자 스캔을 통한 데이터 연동</p>
</div>
</div>
<p class="mt-3 text-slate-500 text-sm italic">실물 카드 없이도 간편하게 본인 인증</p>
</div>
<!-- Right: History Management -->
<div class="feature-card">
<div class="icon-box">
<i class="fa-solid fa-list-check text-5xl text-white"></i>
</div>
<h2 class="text-3xl font-bold mb-3 text-sky-600">투명한 보상 내역 관리</h2>
<div class="space-y-2 w-full">
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">VIEW</span>
<p class="text-lg"><span class="highlight-text">실시간 확인</span> 포인트/경험치 획득/사용</p>
</div>
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">DATA</span>
<p class="text-lg">언제, 어디서 얻었는지 상세 기록</p>
</div>
<div class="step-item">
<span class="text-sky-600 font-black mr-4 text-xl">TRUST</span>
<p class="text-lg">디지털화된 장부로 보상 투명성 확보</p>
</div>
</div>
<div class="mt-4 w-full h-32 rounded-lg overflow-hidden border border-sky-100 shadow-inner bg-slate-50 flex items-center justify-center">
<img alt="보상 내역 확인" class="max-w-full max-h-full object-contain" src="ppt_versions/draft/uploaded_files/8_3_1_마이페이지_포인트경험치내역.png"/>
</div>
<p class="mt-2 text-sky-700 font-bold text-sm">마이페이지 내 상세 포인트/경험치 내역</p>
</div>
</div>
</div>

</body></html>

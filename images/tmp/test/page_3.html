<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body {overflow: hidden; font-family: 'Noto Sans KR', sans-serif;
            width: 1280px;
            min-height: 720px;
            margin: 0;
            
            background-color: #fef3c7;}
        .bg-rpg {
            background: linear-gradient(90deg, #f0f9ff 0%, #e0f2fe 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #d97706;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .progress-bar {
            height: 12px;
            background: #e5e7eb;
            border-radius: 6px;
            
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 75%;
        }
    
}</style>
</head>
<body class="p-0 m-0">
<div class="w-[1280px] h-[720px] bg-white flex flex-col">
<!-- Header Section -->
<div class="bg-rpg px-12 py-6 flex justify-between items-center shadow-md border-b border-sky-100">
<div>
<h1 class="text-4xl font-black text-slate-900 mb-2">시스템 핵심 - 캐릭터와 성장</h1>
<p class="text-sky-600 text-xl font-medium">&#34;나만의 캐릭터, 마법사에서 전사까지!&#34;</p>
</div>
<div class="flex gap-6">
<div class="bg-white border border-sky-200 px-4 py-2 rounded-lg flex items-center gap-3 shadow-sm">
<span class="text-sky-600 font-bold">Lv. 15</span>
<div class="w-24 progress-bar"><div class="progress-fill"></div></div>
</div>
<div class="bg-white border border-sky-200 px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">
<i class="fas fa-coins text-yellow-500"></i>
<span class="text-slate-700 font-bold">1,250 달란트</span>
</div>
</div>
</div>
<!-- Main Content Section -->
<div class="flex-grow p-8 flex flex-col gap-6">
<!-- Top Description -->
<div class="grid grid-cols-2 gap-12">
<div class="flex flex-col justify-center">
<h2 class="text-3xl font-bold text-slate-800 mb-4 flex items-center gap-3">
<i class="fas fa-user-shield text-amber-600"></i>
                        개인화된 캐릭터 시스템
                    </h2>
<ul class="space-y-2">
<li class="flex items-start gap-4">
<div class="mt-1 w-6 h-6 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0">
<i class="fas fa-check text-amber-600 text-xs"></i>
</div>
<p class="text-lg text-slate-700 font-medium">실명 대신 <span class="text-amber-700 font-bold">캐릭터명과 직업</span>으로 학생 몰입도 극대화</p>
</li>
<li class="flex items-start gap-4">
<div class="mt-1 w-6 h-6 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0">
<i class="fas fa-check text-amber-600 text-xs"></i>
</div>
<p class="text-lg text-slate-700 font-medium">마법사, 전사, 궁수 등 다양한 역할군 선택</p>
</li>
</ul>
</div>
<div class="rounded-2xl overflow-hidden shadow-2xl border-4 border-white">
<img alt="회원가입 및 캐릭터 선택" class="w-full h-52 object-contain bg-slate-100" src="ppt_versions/draft/uploaded_files/3_2_회원가입.png"/>
<div class="bg-slate-50 p-3 text-center">
<p class="text-sky-700 font-bold">캐릭터 선택 및 회원가입 화면</p>
</div>
</div>
</div>
<!-- Bottom Feature Grid -->
<div class="grid grid-cols-3 gap-6">
<!-- Feature 1 -->
<div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
<div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-chart-line text-2xl text-amber-600"></i>
</div>
<h3 class="text-xl font-bold text-slate-800 mb-2">성장 지표 시각화</h3>
<p class="text-slate-600 leading-relaxed">
<span class="font-bold">Level</span>과 <span class="font-bold">달란트</span>를 통해 자신의 성장 상태 즉각 확인
                    </p>
</div>
<!-- Feature 2 -->
<div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
<div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-bolt text-2xl text-amber-600"></i>
</div>
<h3 class="text-xl font-bold text-slate-800 mb-2">실시간 경험치(EXP)</h3>
<p class="text-slate-600 leading-relaxed">
                        미션 완료 시 <span class="font-bold">실시간으로 경험치 획득</span> 및 즉각적 보상/성취감
                    </p>
</div>
<!-- Feature 3 -->
<div class="glass-card p-6 rounded-2xl flex flex-col items-center text-center">
<div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-trophy text-2xl text-amber-600"></i>
</div>
<h3 class="text-xl font-bold text-slate-800 mb-2">랭크 시스템</h3>
<p class="text-slate-600 leading-relaxed">
<span class="font-bold">전체/길드별 랭킹</span> 제공하여 경쟁과 참여 동기 유발
                    </p>
</div>
</div>
</div>
<!-- Footer Decoration -->
<div class="h-4 bg-sky-600"></div>
</div>

</body></html>

<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700;900&display=swap');
        
        body {overflow: hidden; width: 1280px; min-height: 720px; font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            
            background-color: #f8fafc;}

        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
            padding: 60px;
            box-sizing: border-box;
            color: #1e293b;
        }

        .text-gradient-blue {
            background: linear-gradient(to bottom, #0ea5e9 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .effect-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .vision-banner {
            background: linear-gradient(90deg, transparent, rgba(2, 132, 199, 0.05), transparent);
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }
    
}</style>
</head>
<body>
<div class="slide-container">
<!-- Header Section -->
<div class="flex justify-between items-start mb-8">
<div class="flex flex-col">
<h2 class="text-sky-600 font-bold tracking-widest text-xl mb-2">VISION &amp; CONCLUSION</h2>
<h1 class="text-6xl font-black text-gradient-blue">결론 및 기대효과</h1>
</div>
<div class="w-48 h-24 rounded-lg overflow-hidden border-2 border-sky-100 shadow-md">
<img class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500" src="https://picture-search.skywork.ai/aippt/image/sheet/f8e640695b5b2b9ec2a9a4d428d93769.jpg"/>
</div>
</div>
<!-- Main Content: Three Core Effects -->
<div class="grid grid-cols-3 gap-8 mb-10">
<!-- Effect 1 -->
<div class="effect-card p-6 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-sky-50 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-chart-pie text-4xl text-sky-600"></i>
</div>
<h3 class="text-2xl font-bold text-slate-800 mb-3">데이터 기반 관리</h3>
<p class="text-slate-600 leading-relaxed">
                    학생들의 활동 데이터를 수치로 확인하여<br/>
                    개별 맞춤형 신앙 케어 가능
                </p>
</div>
<!-- Effect 2 -->
<div class="effect-card p-6 flex flex-col items-center text-center border-sky-200 bg-sky-50/30">
<div class="w-20 h-20 bg-sky-100 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-rocket text-4xl text-sky-600"></i>
</div>
<h3 class="text-2xl font-bold text-slate-800 mb-3">참여율 제고</h3>
<p class="text-slate-600 leading-relaxed">
                    게이미피케이션 요소를 통한<br/>
                    주일학교 출석 및 활동 참여 활성화
                </p>
</div>
<!-- Effect 3 -->
<div class="effect-card p-6 flex flex-col items-center text-center">
<div class="w-20 h-20 bg-sky-50 rounded-full flex items-center justify-center mb-4">
<i class="fas fa-fingerprint text-4xl text-sky-600"></i>
</div>
<h3 class="text-2xl font-bold text-slate-800 mb-3">디지털 전환</h3>
<p class="text-slate-600 leading-relaxed">
                    아날로그 방식의 달란트 제도를<br/>
                    디지털화하여 관리 효율성 극대화
                </p>
</div>
</div>
<!-- Vision Statement Footer -->
<div class="flex-grow flex flex-col justify-end">
<div class="vision-banner py-6 text-center">
<p class="text-sky-600 text-xl font-medium mb-1 tracking-[0.3em]">BONGDONG JOONGANG CHURCH</p>
<h2 class="text-4xl font-black text-slate-900">&#34;다음 세대를 위한 즐거운 신앙의 놀이터&#34;</h2>
</div>
</div>
<!-- Decorative Progress Bar (Visualizing the end of the journey) -->
<div class="mt-6 w-full bg-sky-100 h-2 rounded-full overflow-hidden">
<div class="bg-gradient-to-r from-sky-600 to-sky-400 h-full w-full"></div>
</div>
<div class="flex justify-between mt-2 text-sky-300 text-xs font-bold tracking-tighter">
<span>START ADVENTURE</span>
<span>QUEST COMPLETE</span>
</div>
</div>

</body></html>

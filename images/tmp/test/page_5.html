<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://picture-search.skywork.ai/aippt/static/tailwindcss.com"></script><style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {overflow: hidden; width: 1280px; min-height: 720px; font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            
            background-color: #fcfcfc;}

        .slide-container {
            width: 1280px;
            min-height: 720px;
            padding: 50px 70px;
            box-sizing: border-box;
            background: linear-gradient(135deg, #f0f9ff 0%, #ffffff 100%);
            display: flex;
            flex-direction: column;
        }

        .title-accent {
            border-left: 10px solid #0284c7;
            padding-left: 20px;
        }

        .guild-card {
            background: white;
            border: 1px solid #fde68a;
            border-bottom: 4px solid #d97706;
            transition: all 0.3s ease;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            background: #fff7ed;
            border: 2px solid #fbbf24;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1rem;
        }
    
}</style>
</head>
<body>
<div class="slide-container">
<!-- Header -->
<div class="flex justify-between items-start mb-8">
<div class="title-accent">
<h1 class="text-4xl font-black text-slate-800">주요 기능 2 - 길드 공동체</h1>
<p class="text-sky-600 font-bold text-xl mt-2 italic">&#34;함께해서 더 즐거운 길드&#34;</p>
</div>
<div class="bg-sky-50 px-6 py-2 rounded-lg border border-sky-100">
<span class="text-sky-700 font-bold">Community System</span>
</div>
</div>
<!-- Main Content Area -->
<div class="flex gap-10 items-center mb-6">
<!-- Left: Visual Representation -->
<div class="w-1/2 rounded-2xl overflow-hidden shadow-xl border-4 border-sky-50">
<img alt="길드 본부 UI" class="w-full h-[300px] object-contain bg-slate-100" src="ppt_versions/draft/uploaded_files/6_1_길드본부.png"/>
<div class="bg-sky-600 p-3 text-center">
<p class="text-white font-medium">봉동중앙교회 초등부 길드 본부</p>
</div>
</div>
<!-- Right: Feature List -->
<div class="w-1/2 space-y-4">
<div class="flex items-start gap-5 p-3 bg-white rounded-xl shadow-sm border-l-4 border-sky-500">
<div class="text-sky-500 text-3xl mt-1">
<i class="fa-solid fa-users-rectangle"></i>
</div>
<div>
<h3 class="text-xl font-bold text-slate-800 mb-1">반별 공동체 (Guild)</h3>
<p class="text-slate-600 leading-relaxed">각 반을 하나의 &#39;길드&#39;로 묶어 소속감과 유대감을 강화합니다.</p>
</div>
</div>
<div class="flex items-start gap-5 p-3 bg-white rounded-xl shadow-sm border-l-4 border-sky-500">
<div class="text-sky-500 text-3xl mt-1">
<i class="fa-solid fa-comment-dots"></i>
</div>
<div>
<h3 class="text-xl font-bold text-slate-800 mb-1">길드 응원방</h3>
<p class="text-slate-600 leading-relaxed">길드원끼리 간단한 격려 메시지를 주고받는 소통 공간을 제공합니다.</p>
</div>
</div>
<div class="flex items-start gap-5 p-3 bg-white rounded-xl shadow-sm border-l-4 border-sky-500">
<div class="text-sky-500 text-3xl mt-1">
<i class="fa-solid fa-ranking-star"></i>
</div>
<div>
<h3 class="text-xl font-bold text-slate-800 mb-1">실시간 상태 확인</h3>
<p class="text-slate-600 leading-relaxed">친구들의 레벨과 접속 상태를 확인하며 선의의 경쟁을 유도합니다.</p>
</div>
</div>
</div>
</div>
<!-- Diagram Section: Guild Interaction Flow -->
<div class="bg-slate-50 rounded-2xl p-4 flex justify-around items-center border border-slate-200">
<div class="flex flex-col items-center">
<div class="icon-circle">
<i class="fa-solid fa-handshake-angle text-xl text-sky-600"></i>
</div>
<span class="font-bold text-slate-700">협동 퀘스트</span>
</div>
<div class="text-slate-300 text-xl"><i class="fa-solid fa-chevron-right"></i></div>
<div class="flex flex-col items-center">
<div class="icon-circle">
<i class="fa-solid fa-heart-pulse text-xl text-sky-600"></i>
</div>
<span class="font-bold text-slate-700">공동체 의식</span>
</div>
<div class="text-slate-300 text-xl"><i class="fa-solid fa-chevron-right"></i></div>
<div class="flex flex-col items-center">
<div class="icon-circle">
<i class="fa-solid fa-shield-halved text-xl text-sky-600"></i>
</div>
<span class="font-bold text-slate-700">신앙의 방패</span>
</div>
<div class="text-slate-300 text-xl"><i class="fa-solid fa-chevron-right"></i></div>
<div class="flex flex-col items-center">
<div class="icon-circle">
<i class="fa-solid fa-crown text-xl text-sky-600"></i>
</div>
<span class="font-bold text-slate-700">함께하는 성장</span>
</div>
</div>
</div>

</body></html>
